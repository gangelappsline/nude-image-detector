[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nude-image-detector"
version = "1.0.0"
description = "Flask REST API that scores images (upload or URL) for nudity / NSFW content before they reach your storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that run the real ONNX model (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:flask.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # Flask relies on function calls in default arguments (g.request context)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
