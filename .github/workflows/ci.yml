name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Pruebas rápidas (sin modelo ONNX)
        run: pytest -m "not slow" -q

      - name: Pruebas end-to-end (modelo ONNX real)
        run: pytest -m slow -q

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t nude-image-detector:ci .

      - name: Arrancar y comprobar /ready
        run: |
          docker run -d --name nid -p 8000:8000 nude-image-detector:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then echo; exit 0; fi
            sleep 2
          done
          docker logs nid
          exit 1

      - name: Smoke test contra el contenedor
        run: |
          docker cp scripts/smoke_test.py nid:/tmp/smoke_test.py
          docker exec nid python /tmp/smoke_test.py --base-url http://127.0.0.1:8000
